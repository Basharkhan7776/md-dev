# Same pattern as create-churn: every push → CI; main → also publish to npm
name: CI & Publish

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: bun run build

      - name: Verify artifacts
        run: |
          test -f dist/cli.js
          test -f dist/web/index.html
          test -f bin/md-dev

      - name: CLI smoke test
        run: |
          ./bin/md-dev --version
          ./bin/md-dev --help
          ./bin/md-dev fixtures/sample.md --no-open --no-watch &
          PID=$!
          sleep 1
          curl -sf http://127.0.0.1:5000/ >/dev/null
          curl -sf http://127.0.0.1:5000/api/content | grep -q sample
          kill $PID 2>/dev/null || true

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Check if version is already published
        id: check_version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Package: $NAME@$VERSION"

          if npm view "${NAME}@${VERSION}" version 2>/dev/null; then
            echo "Version ${VERSION} already on npm — skipping publish."
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - uses: oven-sh/setup-bun@v2
        if: steps.check_version.outputs.published != 'true'
        with:
          bun-version: latest

      - name: Install dependencies
        if: steps.check_version.outputs.published != 'true'
        run: bun install

      - name: Publish to npm
        if: steps.check_version.outputs.published != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::Secret NPM_TOKEN is empty. Add it in GitHub → Settings → Secrets → Actions."
            exit 1
          fi

          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          # Publish (npm publish runs prepublishOnly -> bun run build automatically)
          set +e
          OUT=$(npm publish --access public --provenance 2>&1)
          STATUS=$?
          set -e
          echo "$OUT"

          if [ $STATUS -ne 0 ]; then
            if echo "$OUT" | grep -qi "Two-factor authentication\|bypass 2fa\|E403"; then
              echo ""
              echo "::error::NPM_TOKEN is the wrong type for CI."
              echo ""
              echo "Your secret exists, but npm rejects it because 2FA is on."
              echo "Create a NEW token and replace the GitHub secret NPM_TOKEN:"
              echo ""
              echo "  Option A (easiest) — Classic Automation token:"
              echo "    https://www.npmjs.com/settings/~/tokens"
              echo "    Generate New Token → Classic Token → type: Automation"
              echo "    (NOT \"Publish\" — Publish tokens require OTP and fail in CI)"
              echo ""
              echo "  Option B — Granular token:"
              echo "    Generate New Token → Granular Access Token"
              echo "    Permissions: Read and write"
              echo "    Packages: permission to publish (or all packages)"
              echo "    ✅ Enable: Bypass two-factor authentication"
              echo ""
              echo "  Then: GitHub repo → Settings → Secrets → Actions → NPM_TOKEN → update value"
              echo "  Re-run this workflow (or push again)."
              echo ""
              fi
            exit $STATUS
          fi

          echo "Published ${NAME}@${VERSION}"
