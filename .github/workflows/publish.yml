# Same pattern as create-churn: every push → CI; main → also publish to npm
name: CI & Publish

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: bun run build

      - name: Verify artifacts
        run: |
          test -f dist/cli.js
          test -f dist/web/index.html
          test -f bin/mdparse

      - name: CLI smoke test
        run: |
          ./bin/mdparse --version
          ./bin/mdparse --help
          ./bin/mdparse fixtures/sample.md --no-open --no-watch &
          PID=$!
          sleep 1
          curl -sf http://127.0.0.1:5000/ >/dev/null
          curl -sf http://127.0.0.1:5000/api/content | grep -q sample
          kill $PID 2>/dev/null || true

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    # Only publish from main (like create-churn), not PRs or other branches
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install

      - name: Build package
        run: bun run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "NPM_TOKEN secret is missing. Add it under Settings → Secrets → Actions."
            exit 1
          fi

          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "Package: $NAME@$VERSION"

          # Skip if this version is already on the registry (avoids fail on every push)
          if npm view "${NAME}@${VERSION}" version 2>/dev/null; then
            echo "Version ${VERSION} already published — skip (bump package.json version to release)."
            exit 0
          fi

          npm config set //registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN
          npm publish --access public --provenance
          echo "Published ${NAME}@${VERSION}"
