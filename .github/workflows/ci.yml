name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package (web + CLI)
        run: bun run build

      - name: Verify artifacts
        run: |
          test -f dist/cli.js
          test -f dist/web/index.html
          test -x bin/mdparse
          head -1 dist/cli.js | grep -q 'bun' || true
          echo "Artifacts OK"

      - name: CLI smoke test
        run: |
          ./bin/mdparse --version
          ./bin/mdparse --help
          # Start briefly, hit health endpoints, stop
          ./bin/mdparse fixtures/sample.md --no-open --no-watch &
          PID=$!
          sleep 1
          curl -sf http://127.0.0.1:5000/ >/dev/null
          curl -sf http://127.0.0.1:5000/api/content | grep -q sample
          kill $PID || true
